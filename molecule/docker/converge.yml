---
- name: "Converge"
  hosts: all
  become: true
  vars:
    systemd_backup_jobs_definitions:
      # Shell form, attached to the service network, reading a service volume.
      - name: "docker-volume"
        mode: "docker"
        schedule: "*-*-* 01:00:00"
        image: "alpine:3.20"
        network: "molecule-service"
        volumes:
          - "molecule-service-data:/data:ro"
        command: "tar -cf /backup/data.tar -C /data ."
      # Exec form, for images without a shell.
      - name: "docker-exec-form"
        mode: "docker"
        schedule: "*-*-* 01:10:00"
        image: "alpine:3.20"
        volumes:
          - "molecule-service-data:/data:ro"
        command:
          - "cp"
          - "/data/file.txt"
          - "/backup/file.txt"
      - name: "docker-env"
        mode: "docker"
        schedule: "*-*-* 01:20:00"
        image: "alpine:3.20"
        env_file: "/srv/molecule-service.env"
        command: "echo \"$GREETING\" > /backup/greeting.txt"
      - name: "docker-missing-network"
        mode: "docker"
        schedule: "*-*-* 01:30:00"
        image: "alpine:3.20"
        network: "does-not-exist"
        command: "echo never > /backup/never.txt"

  roles:
    - role: "bouola.systemd_backup_jobs"
