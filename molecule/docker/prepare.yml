---
- name: "Prepare"
  hosts: all
  become: true
  tasks:
    - name: "Install Docker"
      ansible.builtin.apt:
        name: "docker.io"
        state: present
        update_cache: true

    - name: "Start Docker"
      ansible.builtin.systemd:
        name: "docker"
        state: started
        enabled: true

    - name: "Create service network"
      ansible.builtin.command:
        cmd: "docker network create molecule-service"
      register: _systemd_backup_jobs_network_create
      changed_when: _systemd_backup_jobs_network_create.rc == 0
      failed_when:
        - _systemd_backup_jobs_network_create.rc != 0
        - "'already exists' not in _systemd_backup_jobs_network_create.stderr"

    - name: "Create service volume with data"
      ansible.builtin.command:
        cmd: >-
          docker run --rm --volume molecule-service-data:/data alpine:3.20
          sh -c 'echo "volume data" > /data/file.txt'
      changed_when: true

    - name: "Create service environment file"
      ansible.builtin.copy:
        dest: "/srv/molecule-service.env"
        content: |
          # Loaded by the docker-env job
          GREETING="hello from env_file"
        owner: "root"
        group: "root"
        mode: "0600"
